# Render Blueprint — POS web app + Python validation service (free tier)
# Dashboard: New → Blueprint → connect GitHub repo marcjustinleeggranada/pos-system

services:
  # Deploy first — Next.js reads this URL via fromService below
  - type: web
    name: pos-validation
    runtime: docker
    plan: free
    dockerfilePath: ./validation-service/Dockerfile
    dockerContext: ./validation-service
    healthCheckPath: /health

  - type: web
    name: pos-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VALIDATION_SERVICE_URL
        fromService:
          type: web
          name: pos-validation
          property: host
